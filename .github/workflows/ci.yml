name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test, deny)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (pedantic)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check

  app:
    name: macOS app (xcodebuild build + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 16.4 if available
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: xcodebuild build
        run: >
          xcodebuild -project apps/macos/LocalTransfer.xcodeproj -scheme LocalTransfer
          -destination 'platform=macOS,arch=arm64' build
      - name: xcodebuild test
        run: >
          xcodebuild -project apps/macos/LocalTransfer.xcodeproj -scheme LocalTransfer
          -destination 'platform=macOS,arch=arm64' test
