[workspace]
resolver = "3"
members = ["crates/lt-core", "crates/lt-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/siddharthakumar-98/LocalTransfer"
publish = false

[workspace.dependencies]
lt-core = { path = "crates/lt-core" }
# The proc-macro (lt-ffi) and the bindgen binary (uniffi-bindgen) must use the
# exact same UniFFI version, or the generated Swift won't match the scaffolding.
uniffi = "=0.32.2"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", default-features = false }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
